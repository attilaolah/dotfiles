name: Renovate overlay hash refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-overlay-hashes:
    if: >-
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          auto-optimise-store = true
          experimental-features = nix-command flakes

    - name: Refresh hashes and lock changed flake inputs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        base_ref='${{ github.event.pull_request.base.ref }}'
        git fetch --no-tags --depth=1 origin \
          "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"

        changed_overlays=()
        mapfile -d '' -t changed_overlays < <(
          git diff --name-only -z "origin/${base_ref}...HEAD" -- 'overlays/*.nix'
        )

        changed_flake_inputs=()
        mapfile -t changed_flake_inputs < <(
          git diff --unified=1000 "origin/${base_ref}...HEAD" -- flake.nix |
            awk '
                /^\+[[:space:]]*inputs\.[A-Za-z_][A-Za-z0-9_-]*\.url[[:space:]]*=/ {
                  input = $0
                  sub(/^\+[[:space:]]*inputs\./, "", input)
                  sub(/\.url[[:space:]]*=.*/, "", input)
                  print input
                  next
                }
                /^[ +][[:space:]]*[A-Za-z_][A-Za-z0-9_-]*[[:space:]]*=[[:space:]]*\{/ {
                  input = $0
                  sub(/^[ +][[:space:]]*/, "", input)
                  sub(/[[:space:]]*=.*/, "", input)
                  next
                }
                /^\+[[:space:]]*url[[:space:]]*=/ && input != "" {
                  print input
                }
              ' |
            sort -u
        )

        if [[ "${#changed_overlays[@]}" -eq 0 && "${#changed_flake_inputs[@]}" -eq 0 ]]; then
          echo 'No overlay or flake input changes detected.'
          exit 0
        fi

        collect_hash_keys() {
          local overlay="$1"
          # Dependency hashes are derived from the fetched source tree.
          grep -E "^[[:space:]]*hash-[A-Za-z0-9._-]+[[:space:]]*=[[:space:]]*\"sha256-[A-Za-z0-9+/]{43}=\"" "${overlay}" |
            sed -E "s/^[[:space:]]*(hash-[A-Za-z0-9._-]+)[[:space:]]*=.*/\\1/" |
            awk '
              !seen[$0]++ {
                keys[++n] = $0;
              }
              END {
                for (pass = 1; pass >= 0; pass--) {
                  for (i = 1; i <= n; i++) {
                    source_first = keys[i] ~ /^hash-src($|-)/;
                    if (source_first == pass) {
                      print keys[i];
                    }
                  }
                }
              }
            ' || true
        }

        mapping_for_hash_key() {
          local package_name="$1"
          local key="$2"
          local suffix

          suffix="${key#hash-}"

          echo "${key}=${package_name}-${suffix}"
        }

        updated_any='false'
        for overlay in "${changed_overlays[@]}"; do

          package_name="$(basename "${overlay}" .nix | tr '_' '-')"
          mappings=()

          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            mappings+=("$(mapping_for_hash_key "${package_name}" "${key}")")
          done < <(collect_hash_keys "${overlay}")

          if [[ "${#mappings[@]}" -eq 0 ]]; then
            echo "No hash keys detected in ${overlay}; skipping."
            continue
          fi

          ./.github/scripts/update_overlay_hashes.sh "${overlay}" "${mappings[@]}"
          updated_any='true'
        done

        if [[ "${updated_any}" != 'true' ]]; then
          echo 'No mapped overlay hash updates required.'
        fi

        for input in "${changed_flake_inputs[@]}"; do
          echo "Updating flake lock input: ${input}"
          nix flake lock --update-input "${input}"
        done

    - name: Commit hash updates via GitHub API (GitHub-signed)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if git diff --quiet -- overlays flake.lock; then
          echo 'No overlay hash or flake lock updates needed.'
          exit 0
        fi

        branch='${{ github.event.pull_request.head.ref }}'
        repo='${{ github.repository }}'
        message='chore(renovate): refresh overlay hashes and flake lock'

        expected_head_oid="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"

        additions_json="$(
          git diff --name-only -z -- overlays flake.lock |
            while IFS= read -r -d '' path; do
              contents="$(base64 < "${path}" | tr -d '\n')"
              jq -n --arg path "${path}" --arg contents "${contents}" \
                '{path: $path, contents: $contents}'
            done |
            jq -s .
        )"

        mutation='
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit {
                oid
              }
            }
          }
        '

        commit_oid="$(
          jq -n \
            --arg query "${mutation}" \
            --arg repo "${repo}" \
            --arg branch "${branch}" \
            --arg expected_head_oid "${expected_head_oid}" \
            --arg message "${message}" \
            --argjson additions "${additions_json}" \
            '{
              query: $query,
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  expectedHeadOid: $expected_head_oid,
                  message: {
                    headline: $message
                  },
                  fileChanges: {
                    additions: $additions
                  }
                }
              }
            }' |
            gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'
        )"

        verification="$(
          gh api "repos/${repo}/commits/${commit_oid}" \
            --jq '.commit.verification.reason'
        )"

        if [[ "${verification}" != 'valid' ]]; then
          echo "Commit ${commit_oid} was not GitHub-verified (reason: ${verification})." >&2
          exit 1
        fi
